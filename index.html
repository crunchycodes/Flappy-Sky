<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Sky Mobile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* Custom pixel font style for retro arcade feel */
        .arcade-font {
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0 3px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-900 h-screen w-screen flex items-center justify-center p-0 m-0 select-none">

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full max-w-md max-h-[850px] bg-sky-400 overflow-hidden shadow-2xl md:rounded-2xl flex flex-col items-center justify-center">
        
        <!-- Canvas -->
        <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>

        <!-- UI Overlay: Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/20 backdrop-blur-[2px] p-6 text-center z-10 transition-opacity duration-300">
            <h1 class="text-5xl font-extrabold text-yellow-400 arcade-font mb-2 tracking-wider drop-shadow-lg">FLAPPY SKY</h1>
            <p class="text-white text-lg font-semibold mb-6 drop-shadow">Tap screen or press Space to make this dude JUMP</p>
            
            <div class="mb-8 p-4 bg-sky-900/60 rounded-xl border-2 border-sky-300/40 backdrop-blur-md text-white flex items-center space-x-4">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center overflow-hidden p-2 border-2 border-yellow-300">
                    <img src="https://i.imgur.com/2PMc3kt.png" id="preview-img" alt="You can only play as" class="w-full h-full object-contain" crossorigin="anonymous">
                </div>
                <div class="text-left">
                    <div class="text-xs uppercase tracking-widest text-sky-200">Character Ready</div>
                    <div class="text-sm font-bold text-yellow-300">Skylar</div>
                </div>
            </div>

            <button id="start-btn" class="px-8 py-4 bg-gradient-to-r from-green-400 to-emerald-600 hover:from-green-500 hover:to-emerald-700 text-white font-extrabold text-2xl rounded-full border-4 border-white shadow-lg active:scale-95 transition transform arcade-font tracking-wide">
                TAP TO PLAY
            </button>
        </div>

        <!-- UI Overlay: Game Over Screen -->
        <div id="gameover-screen" class="absolute inset-0 hidden flex flex-col items-center justify-center bg-black/60 backdrop-blur-md p-6 text-center z-20">
            <div class="bg-amber-100 border-4 border-amber-800 rounded-2xl p-6 w-5/6 max-w-xs shadow-2xl text-amber-900 transform transition-transform scale-100 pointer-events-auto">
                <h2 class="text-4xl font-extrabold text-red-600 arcade-font mb-4 tracking-wider">YOU FUCKED UP</h2>
                
                <div class="bg-amber-200/80 rounded-xl p-4 mb-4 border-2 border-amber-700/30">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-amber-900 text-sm uppercase">Score</span>
                        <span id="final-score" class="text-3xl font-extrabold text-amber-900 arcade-font">0</span>
                    </div>
                    <div class="h-0.5 bg-amber-800/20 my-2"></div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-amber-900 text-sm uppercase">Best</span>
                        <span id="best-score" class="text-3xl font-extrabold text-yellow-600 arcade-font">0</span>
                    </div>
                </div>

                <!-- Medal area -->
                <div id="medal-container" class="hidden mb-4 p-2 bg-amber-300/50 rounded-lg flex items-center justify-center gap-2">
                    <span id="medal-icon" class="text-2xl">🥇</span>
                    <span id="medal-text" class="font-bold text-xs text-amber-900 uppercase">New High Score!</span>
                </div>

                <button id="restart-btn" class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold text-xl rounded-xl border-2 border-white shadow-md active:scale-95 transition transform arcade-font tracking-wider cursor-pointer">
                    PLAY AGAIN
                </button>
            </div>
        </div>

        <!-- On-Screen Audio Toggle -->
        <button id="audio-toggle" class="absolute top-4 right-4 z-30 w-10 h-10 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center backdrop-blur-sm border border-white/30 text-lg">
            🔊
        </button>

        <!-- Current Score Display (In-Game) -->
        <div id="hud-score" class="absolute top-8 z-10 text-6xl font-black text-white arcade-font pointer-events-none drop-shadow-md hidden">
            0
        </div>
    </div>

    <script>
        // Web Audio API Sound System
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playScore() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const sound = new SoundSystem();

        // Game Elements & Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const hudScore = document.getElementById('hud-score');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');
        const audioToggleBtn = document.getElementById('audio-toggle');
        const medalContainer = document.getElementById('medal-container');

        // Audio toggle handler
        audioToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sound.muted = !sound.muted;
            audioToggleBtn.textContent = sound.muted ? '🔇' : '🔊';
        });

        // Load Custom Character Image
        const playerImg = new Image();
        playerImg.crossOrigin = 'anonymous';
        playerImg.src = 'https://i.imgur.com/2PMc3kt.png';
        let imgLoaded = false;
        playerImg.onload = () => { imgLoaded = true; };
        playerImg.onerror = () => { imgLoaded = false; };

        // Updated Custom Background Images Management
        const bgUrls = [
            'https://i.imgur.com/YdQKogm.jpeg',
            'https://i.imgur.com/H06ZdIG.jpeg',
            'https://i.imgur.com/ZrqCCrc.png',
            'https://i.imgur.com/UgwcwKb.jpeg',
            'https://i.imgur.com/AaI8yvO.jpeg'
        ];

        const bgImages = bgUrls.map(url => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.loaded = false;
            img.onload = () => { img.loaded = true; };
            img.onerror = () => { img.loaded = false; };
            img.src = url;
            return img;
        });

        let bgPlaylist = [];
        let bgScrollX = 0;

        function shuffleBackgrounds() {
            // Fisher-Yates Shuffle
            const array = [...bgImages];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initBackgrounds() {
            bgPlaylist = shuffleBackgrounds();
            bgScrollX = 0;
        }

        // Scale & Dimensions
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = gameContainer.clientWidth;
            height = gameContainer.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State Variables
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_high_score') || '0', 10);
        let frames = 0;

        // Menu Sky Animation Clouds Data
        let menuClouds = [
            { x: 0.1, y: 0.18, scale: 0.9, speed: 0.3 },
            { x: 0.55, y: 0.28, scale: 1.2, speed: 0.45 },
            { x: 0.85, y: 0.12, scale: 0.7, speed: 0.25 },
            { x: 0.3, y: 0.42, scale: 1.0, speed: 0.35 }
        ];

        // Physics Constants
        const getPhysics = () => ({
            gravity: height * 0.00042,
            jumpStrength: -height * 0.0105,
            pipeSpeed: width * 0.0055,
            bgSpeed: width * 0.0018, // Speed for scrolling background
            pipeSpawnInterval: 100,
            pipeGap: height * 0.22,
            groundHeight: height * 0.12
        });

        // Player Object
        const player = {
            x: 0,
            y: 0,
            radius: 0,
            velocity: 0,
            rotation: 0,

            reset() {
                this.x = width * 0.25;
                this.y = height * 0.4;
                this.radius = Math.min(width, height) * 0.058;
                this.velocity = 0;
                this.rotation = 0;
            },

            jump() {
                const p = getPhysics();
                this.velocity = p.jumpStrength;
                sound.playJump();
            },

            update() {
                const p = getPhysics();
                this.velocity += p.gravity;
                this.y += this.velocity;

                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (this.velocity / (p.jumpStrength * -1.5)) * -Math.PI / 4));

                if (this.y + this.radius >= height - p.groundHeight) {
                    this.y = height - p.groundHeight - this.radius;
                    return true;
                }

                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }

                return false;
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const size = this.radius * 2.4;

                if (imgLoaded) {
                    ctx.drawImage(playerImg, -size / 2, -size / 2, size, size);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#facc15';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#000';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(this.radius * 0.3, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.radius * 0.4, -this.radius * 0.3, this.radius * 0.1, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.radius * 0.4, 0);
                    ctx.lineTo(this.radius * 1.1, this.radius * 0.2);
                    ctx.lineTo(this.radius * 0.4, this.radius * 0.4);
                    ctx.closePath();
                    ctx.fillStyle = '#f97316';
                    ctx.fill();
                }

                ctx.restore();
            }
        };

        // Pipe Management
        let pipes = [];

        class Pipe {
            constructor() {
                const p = getPhysics();
                this.x = width;
                this.width = width * 0.16;
                this.passed = false;

                const minTop = height * 0.1;
                const maxTop = height - p.groundHeight - p.pipeGap - (height * 0.1);
                this.topHeight = minTop + Math.random() * (maxTop - minTop);
                this.bottomY = this.topHeight + p.pipeGap;
            }

            update() {
                const p = getPhysics();
                this.x -= p.pipeSpeed;
            }

            draw() {
                ctx.fillStyle = '#22c55e';
                ctx.strokeStyle = '#15803d';
                ctx.lineWidth = 3;

                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                ctx.strokeRect(this.x, 0, this.width, this.topHeight);

                const capHeight = 20;
                ctx.fillRect(this.x - 4, this.topHeight - capHeight, this.width + 8, capHeight);
                ctx.strokeRect(this.x - 4, this.topHeight - capHeight, this.width + 8, capHeight);

                const bottomPipeHeight = height - getPhysics().groundHeight - this.bottomY;
                ctx.fillRect(this.x, this.bottomY, this.width, bottomPipeHeight);
                ctx.strokeRect(this.x, this.bottomY, this.width, bottomPipeHeight);

                ctx.fillRect(this.x - 4, this.bottomY, this.width + 8, capHeight);
                ctx.strokeRect(this.x - 4, this.bottomY, this.width + 8, capHeight);
            }

            collidesWith(p) {
                const checkRect = (rx, ry, rw, rh) => {
                    const closestX = Math.max(rx, Math.min(p.x, rx + rw));
                    const closestY = Math.max(ry, Math.min(p.y, ry + rh));
                    const distanceX = p.x - closestX;
                    const distanceY = p.y - closestY;
                    return (distanceX * distanceX + distanceY * distanceY) < (p.radius * p.radius);
                };

                if (checkRect(this.x, 0, this.width, this.topHeight)) return true;
                const bottomPipeHeight = height - getPhysics().groundHeight - this.bottomY;
                if (checkRect(this.x, this.bottomY, this.width, bottomPipeHeight)) return true;

                return false;
            }
        }

        // Scrolling Background & Environment Drawing
        let groundOffset = 0;

        function drawSimulatedSky() {
            const p = getPhysics();
            const skyHeight = height - p.groundHeight;

            const skyGradient = ctx.createLinearGradient(0, 0, 0, skyHeight);
            skyGradient.addColorStop(0, '#0284c7');
            skyGradient.addColorStop(0.6, '#38bdf8');
            skyGradient.addColorStop(1, '#bae6fd');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, skyHeight);

            const sunGlow = ctx.createRadialGradient(width * 0.8, skyHeight * 0.2, 10, width * 0.8, skyHeight * 0.2, 90);
            sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.8)');
            sunGlow.addColorStop(0.5, 'rgba(253, 224, 71, 0.3)');
            sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, width, skyHeight);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            menuClouds.forEach(c => {
                c.x += (c.speed * 0.001);
                if (c.x > 1.3) c.x = -0.3;

                const cx = c.x * width;
                const cy = c.y * skyHeight;
                const r = 24 * c.scale;

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.arc(cx + r * 0.7, cy - r * 0.3, r * 1.1, 0, Math.PI * 2);
                ctx.arc(cx + r * 1.5, cy, r * 0.9, 0, Math.PI * 2);
                ctx.arc(cx - r * 0.6, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawBackground() {
            if (gameState === 'START') {
                drawSimulatedSky();
                return;
            }

            const p = getPhysics();
            const skyHeight = height - p.groundHeight;

            if (gameState === 'PLAYING') {
                bgScrollX += p.bgSpeed;
            }

            if (bgPlaylist.length === 0) {
                initBackgrounds();
            }

            let currentX = -(bgScrollX % width);
            let imgIndex = Math.floor(bgScrollX / width) % bgPlaylist.length;

            // Render current and next background image with smooth blend/fade between seams
            for (let i = 0; i < 2; i++) {
                const renderX = currentX + (i * width);
                const currentImg = bgPlaylist[(imgIndex + i) % bgPlaylist.length];

                ctx.save();

                // Calculate fade alpha for seamless cross-fading near edges
                if (i === 1) {
                    const offsetPercentage = Math.abs(currentX) / width; // 0 to 1 as it scrolls
                    const fadeWidth = 0.35; // Blend transition threshold (35% width overlap)
                    let alpha = 1;
                    if (offsetPercentage < fadeWidth) {
                        alpha = offsetPercentage / fadeWidth;
                    }
                    ctx.globalAlpha = Math.min(1, Math.max(0, alpha));
                }

                if (currentImg && currentImg.loaded) {
                    ctx.drawImage(currentImg, renderX, 0, width, skyHeight);
                } else {
                    const skyGradient = ctx.createLinearGradient(0, 0, 0, skyHeight);
                    skyGradient.addColorStop(0, '#38bdf8');
                    skyGradient.addColorStop(1, '#bae6fd');
                    ctx.fillStyle = skyGradient;
                    ctx.fillRect(renderX, 0, width, skyHeight);
                }

                ctx.restore();
            }
        }

        function drawGround() {
            const p = getPhysics();

            if (gameState === 'PLAYING') {
                groundOffset = (groundOffset + p.pipeSpeed) % 24;
            }

            // Ground Top Border (Grass)
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, height - p.groundHeight, width, 16);

            // Dirt
            ctx.fillStyle = '#eab308';
            ctx.fillRect(0, height - p.groundHeight + 16, width, p.groundHeight - 16);

            // Ground Stripes Animation
            ctx.fillStyle = '#ca8a04';
            for (let i = -24; i < width + 24; i += 24) {
                ctx.beginPath();
                ctx.moveTo(i - groundOffset, height - p.groundHeight + 16);
                ctx.lineTo(i - groundOffset + 12, height - p.groundHeight + 16);
                ctx.lineTo(i - groundOffset + 4, height);
                ctx.lineTo(i - groundOffset - 8, height);
                ctx.closePath();
                ctx.fill();
            }

            // Dark Border separating ground
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, height - p.groundHeight, width, 3);
        }

        function initGame() {
            player.reset();
            pipes = [];
            score = 0;
            frames = 0;
            hudScore.textContent = '0';
            initBackgrounds();
        }

        function showMainMenu() {
            initGame();
            gameState = 'START';
            gameoverScreen.classList.add('hidden');
            hudScore.classList.add('hidden');
            startScreen.classList.remove('opacity-0', 'pointer-events-none');
        }

        function startGame() {
            sound.init();
            initGame();
            gameState = 'PLAYING';
            startScreen.classList.add('opacity-0', 'pointer-events-none');
            gameoverScreen.classList.add('hidden');
            hudScore.classList.remove('hidden');
            player.jump();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            sound.playHit();

            let isNewHighScore = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_high_score', highScore.toString());
                isNewHighScore = true;
            }

            finalScoreEl.textContent = score;
            bestScoreEl.textContent = highScore;

            if (isNewHighScore && score > 0) {
                medalContainer.classList.remove('hidden');
            } else {
                medalContainer.classList.add('hidden');
            }

            hudScore.classList.add('hidden');
            gameoverScreen.classList.remove('hidden');
        }

        // Main Loop
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            
            if (gameState === 'PLAYING') {
                frames++;

                const p = getPhysics();
                if (frames % p.pipeSpawnInterval === 0) {
                    pipes.push(new Pipe());
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();

                    if (!pipes[i].passed && pipes[i].x + pipes[i].width < player.x) {
                        pipes[i].passed = true;
                        score++;
                        hudScore.textContent = score;
                        sound.playScore();
                    }

                    if (pipes[i].collidesWith(player)) {
                        gameOver();
                    }

                    if (pipes[i].x + pipes[i].width < -10) {
                        pipes.splice(i, 1);
                    }
                }

                if (player.update()) {
                    gameOver();
                }

                player.draw();
            } else if (gameState === 'START') {
                player.reset();
                player.y = (height * 0.4) + Math.sin(Date.now() / 200) * 8;
                player.draw();
            } else if (gameState === 'GAMEOVER') {
                pipes.forEach(pipe => pipe.draw());
                player.draw();
            }

            drawGround();

            requestAnimationFrame(gameLoop);
        }

        function handleInteraction(e) {
            if (gameState === 'GAMEOVER') return; // Ignore container clicks during Game Over screen
            if (e.target === audioToggleBtn || audioToggleBtn.contains(e.target)) return;

            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'PLAYING') {
                player.jump();
            }
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'GAMEOVER') {
                    showMainMenu();
                } else {
                    handleInteraction(e);
                }
            }
        });

        gameContainer.addEventListener('touchstart', (e) => {
            if (gameState === 'GAMEOVER') return;
            e.preventDefault();
            handleInteraction(e);
        }, { passive: false });

        gameContainer.addEventListener('mousedown', (e) => {
            if (gameState === 'GAMEOVER') return;
            if (e.button === 0) {
                handleInteraction(e);
            }
        });

        const triggerStart = (e) => {
            e.preventDefault();
            e.stopPropagation();
            startGame();
        };

        const triggerMainMenu = (e) => {
            e.preventDefault();
            e.stopPropagation();
            showMainMenu();
        };

        startBtn.addEventListener('click', triggerStart);
        startBtn.addEventListener('touchstart', triggerStart);

        restartBtn.addEventListener('click', triggerMainMenu);
        restartBtn.addEventListener('touchstart', triggerMainMenu);

        initBackgrounds();
        player.reset();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
